<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teven</title>
  <meta name="build" content="2026-10-25-5">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="left">
      <div id="clock">--:--</div>
      <div id="date"></div>
      <div id="week"></div>
      <div class="weather">
        <div class="wrow"><span id="wtemp">--&deg;</span><span id="wdesc"></span></div>
        <div id="wdays"></div>
      </div>
      <h2>Keps &amp; Hector</h2>
      <div id="events"></div>
    </section>
    <section class="kcol" id="col-otis">
      <div class="khead" id="head-otis"></div>
      <h2 id="calh-otis" style="display:none">Kalender</h2>
      <div id="cal-otis"></div>
      <h2>Träningar/Matcher</h2>
      <div id="tr-otis"></div>
      <h2 class="hwhead">Läxor &amp; prov</h2>
      <div id="hw-otis"></div>
    </section>
    <section class="kcol" id="col-melker">
      <div class="khead" id="head-melker"></div>
      <h2 id="calh-melker" style="display:none">Kalender</h2>
      <div id="cal-melker"></div>
      <h2>Träningar/Matcher</h2>
      <div id="tr-melker"></div>
      <h2 class="hwhead">Läxor &amp; prov</h2>
      <div id="hw-melker"></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
