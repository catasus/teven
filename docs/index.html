<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teven</title>
  <meta name="build" content="2026-10-25-14">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="left">
      <div class="hero">
        <div id="clock">--:--</div>
        <div id="date"></div>
        <div id="week"></div>
        <div class="weather">
          <div class="wrow"><span id="wtemp">--&deg;</span><span id="wdesc"></span></div>
          <div id="wdays"></div>
        </div>

      </div>
      <h2>Keps &amp; Hector</h2>
      <div id="events"></div>
    </section>
    <div class="right">
      <section class="kbox" id="box-otis">
        <div class="kname" id="head-otis"></div>
        <div class="kmain">
          <div class="kdays" id="days-otis"></div>
          <div class="klater" id="later-otis"></div>
        </div>
      </section>
      <section class="kbox" id="box-melker">
        <div class="kname" id="head-melker"></div>
        <div class="kmain">
          <div class="kdays" id="days-melker"></div>
          <div class="klater" id="later-melker"></div>
        </div>
      </section>
    </div>
  </main>
  <div id="dim"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
