name: Uppdatera kalender
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node scripts/fetch-calendar.mjs
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
      - name: Spara om något ändrats
        run: |
          git config user.name "teven-bot"
          git config user.email "teven-bot@users.noreply.github.com"
          git add docs/events.json
          git diff --cached --quiet || (git commit -m "Uppdatera kalender" && git push)
