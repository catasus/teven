name: Uppdatera kalender
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node scripts/fetch-calendar.mjs CALENDAR_ICS_URL docs/events.json 14
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
      - run: node scripts/fetch-calendar.mjs KIDS_ICS_URLS docs/kids.json 7
        env:
          KIDS_ICS_URLS: ${{ secrets.KIDS_ICS_URLS }}
      - run: node scripts/fetch-calendar.mjs HOMEWORK_ICS_URLS docs/homework.json 14 desc
        env:
          HOMEWORK_ICS_URLS: ${{ secrets.HOMEWORK_ICS_URLS }}
      - name: Spara om något ändrats
        run: |
          git config user.name "teven-bot"
          git config user.email "teven-bot@users.noreply.github.com"
          git add docs/events.json docs/kids.json docs/homework.json
          git diff --cached --quiet || (git commit -m "Uppdatera kalender" && git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push)
