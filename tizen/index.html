<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Teven</title>
  <style>html,body{margin:0;background:#0e0f12;color:#8b8d93;font-family:sans-serif}</style>
</head>
<body>
  <p id="m" style="position:absolute;top:45%;width:100%;text-align:center;font-size:32px">Laddar…</p>
  <script>
    // Byt ut mot din egen GitHub Pages-adress
    var URL_TO_OPEN = "https://catasus.github.io/teven/";
    function go() { window.location.replace(URL_TO_OPEN); }
    // Vänta på nätverket efter TV-start
    var tries = 0;
    (function try_() {
      var x = new XMLHttpRequest();
      x.open("GET", URL_TO_OPEN, true);
      x.onload = go;
      x.onerror = function () {
        if (++tries > 30) { document.getElementById("m").textContent = "Inget nätverk"; return; }
        setTimeout(try_, 2000);
      };
      x.send();
    })();
  </script>
</body>
</html>
